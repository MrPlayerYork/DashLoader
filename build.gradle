plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
    id 'java'
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url "https://notalpha.dev/maven/releases"
        content {
            includeGroup "dev.notalpha"
        }
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }
}

// Development tools (state dumps, stage timings). They run in the dev client but are not part of the release jar.
sourceSets {
    dev {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devImplementation.extendsFrom implementation
    devRuntimeOnly.extendsFrom runtimeOnly
    // Loom puts the launch tooling on the runtime classpath of the main source set only
    devRuntimeClasspath.extendsFrom runtimeClasspath
}

loom {
    accessWidenerPath = file("src/main/resources/dashloader.accesswidener")
    log4jConfigs.from(file("log4j-dev.xml"))
    mods {
        dashloader { sourceSet sourceSets.main }
        dashloader_dev { sourceSet sourceSets.dev }
    }
    runs {
        client { source sourceSets.dev }
    }
}
// Compile the development tools with every build so they cannot rot, even though they are not in the jar.
tasks.named('build') { dependsOn tasks.named('devClasses') }

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation "dev.notalpha:Hyphen:0.4.0-rc.5"
    include "dev.notalpha:Hyphen:0.4.0-rc.5"

    implementation "dev.notalpha:Taski:2.1.0"
    include "dev.notalpha:Taski:2.1.0"

    implementation 'com.github.luben:zstd-jni:1.5.7-1'
    include 'com.github.luben:zstd-jni:1.5.7-1'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly fabricApi.module("fabric-renderer-indigo", project.fabric_version)
    compileOnly fabricApi.module("fabric-resource-loader-v1", project.fabric_version)

    // For Modmenu
    runtimeOnly fabricApi.module("fabric-api-base", project.fabric_version)
    runtimeOnly fabricApi.module("fabric-key-mapping-api-v1", project.fabric_version)
    runtimeOnly fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    runtimeOnly fabricApi.module("fabric-resource-loader-v1", project.fabric_version)
    runtimeOnly fabricApi.module("fabric-screen-api-v1", project.fabric_version)
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.compilerArgs << "-Xmaxerrs" << "5000"

    // Minecraft 1.17 (21w19a) upwards uses Java 16.
    it.options.release = 25
}

java {
    withSourcesJar()
}

jar {
    from("LICENCE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.register("getVersion") {
    print("$project.version")
}
